x-nexos:
  name: Transmission
  tagline:
    en: Lightweight BitTorrent client with web interface
    it: Client BitTorrent leggero con interfaccia web
  description:
    en: Transmission is a fast, lightweight and open-source BitTorrent client with a clean web interface accessible from any browser. It supports magnet links, DHT, PEX, peer encryption, bandwidth scheduling and watch folders for automatic torrent additions. Minimal resource usage makes it ideal for always-on servers.
    it: Transmission è un client BitTorrent veloce, leggero e open-source con un'interfaccia web accessibile da qualsiasi browser. Supporta link magnet, DHT, PEX, cifratura peer, pianificazione della banda e cartelle di monitoraggio per l'aggiunta automatica dei torrent. Il consumo minimo di risorse lo rende ideale per server sempre accesi.
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/transmission.svg
  thumbnail: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/transmission.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Transmission/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Transmission/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Transmission/screenshot-3.png
  category: Downloaders
  tags:
    - torrent
    - bittorrent
    - downloader
    - p2p
  developer: linuxserver
  version: latest
  license: GPL-2.0
  port: 9091
  arch:
    - amd64
    - arm64
    - arm/v7
  ports:
    - port: 9091
      description:
        en: "Web interface"
        it: "Interfaccia web"
      protocol: tcp
    - port: 51413
      description:
        en: "BitTorrent peer connections (TCP)"
        it: "Connessioni BitTorrent con i peer (TCP)"
      protocol: tcp
    - port: 51413
      description:
        en: "BitTorrent peer connections (UDP)"
        it: "Connessioni BitTorrent con i peer (UDP)"
      protocol: udp
  website: https://transmissionbt.com
  repo: https://github.com/transmission/transmission
  docs: https://github.com/transmission/transmission/wiki
  template_version: 3
  web:
    port: HOST_PORT
    scheme: http
    path: /
  env:
    - name: HOST_PORT
      description:
        en: "Host port for the Transmission web interface"
        it: "Porta dell'host per l'interfaccia web di Transmission"
      required: true
      default: "9091"
      type: port
    - name: PEERPORT
      description:
        en: "BitTorrent peer port used for incoming connections (TCP and UDP)"
        it: "Porta BitTorrent per le connessioni in ingresso (TCP e UDP)"
      hint:
        en: "Open this port on your firewall and forward it on your router for the best connectivity.\nThe same value is applied both to the Transmission setting and the host port mapping."
        it: "Apri questa porta sul firewall e inoltrala sul router per la migliore connettività.\nLo stesso valore vale per l'impostazione di Transmission e per la porta pubblicata sull'host."
      required: true
      default: "51413"
      type: port
    - name: PUID
      gid_var: PGID
      description:
        en: "UID of the user that owns your download files"
        it: "Utente proprietario dei file scaricati"
      required: false
      default: "1000"
      type: user
    - name: PGID
      description:
        en: "GID of the user that owns your download files"
        it: "Gruppo proprietario dei file scaricati"
      required: false
      default: "1000"
      type: group
    - name: TZ
      detect: timezone
      description:
        en: "Timezone"
        it: "Fuso orario"
      required: false
      default: Europe/Rome
      placeholder: "Europe/Rome"
    - name: USER
      description:
        en: "Username for the web interface (leave empty to disable authentication)"
        it: "Nome utente dell'interfaccia web (vuoto per disattivare l'autenticazione)"
      required: false
      placeholder: "admin"
    - name: PASS
      description:
        en: "Password for the web interface"
        it: "Password dell'interfaccia web"
      required: false
      sensitive: true
  volumes:
    - container: /config
      description:
        en: "Transmission configuration, settings and resume files"
        it: "Configurazione, impostazioni e file di ripresa di Transmission"
      required: true
    - container: /downloads
      description:
        en: "Directory where completed and in-progress downloads are stored"
        it: "Cartella dei download completati e in corso"
      required: true
    - container: /watch
      description:
        en: "Watch folder — .torrent files placed here are added automatically (optional)"
        it: "Cartella monitorata: i file .torrent messi qui vengono aggiunti automaticamente (facoltativa)"
      required: false

services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=???
      - PGID=???
      - TZ=???
      - PEERPORT=???
      - USER=
      - PASS=
    ports:
      - "${HOST_PORT}:9091"
      - "${PEERPORT}:51413"
      - "${PEERPORT}:51413/udp"
    volumes:
      - ???:/config
      - ???:/downloads
      - ???:/watch
    restart: unless-stopped
