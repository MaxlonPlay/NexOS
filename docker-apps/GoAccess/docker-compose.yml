x-nexos:
  name: GoAccess
  tagline:
    en: Real-time web log analyzer for Nginx Proxy Manager
    it: Analizzatore di log in tempo reale per Nginx Proxy Manager
  description:
    en: |-
      GoAccess is a real-time web log analyzer and interactive viewer that runs
      in a browser. This variant is preconfigured for Nginx Proxy Manager logs
      and provides live traffic statistics, top visitors, requests, referrers,
      and browser breakdowns — all in a self-hosted dashboard.
    it: |-
      GoAccess è un analizzatore di log web in tempo reale con interfaccia browser.
      Questa variante è preconfigurata per i log di Nginx Proxy Manager e fornisce
      statistiche di traffico live, visitatori, richieste, referrer e breakdown
      per browser — tutto in una dashboard self-hosted.
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/goaccess.svg
  category: Monitoring
  tags:
    - logs
    - analytics
    - nginx
    - monitoring
  developer: xavierh
  version: latest
  port: 7880
  repo: https://github.com/xavier-hernandez/goaccess-for-nginxproxymanager
  template_version: 2
  web:
    port: PORT
    scheme: http
    path: /
  post_install:
    notes:
      en: "Sign in with {BASIC_AUTH_USERNAME} / {BASIC_AUTH_PASSWORD}."
      it: "Accedi con {BASIC_AUTH_USERNAME} / {BASIC_AUTH_PASSWORD}."
  env:
    - name: TZ
      detect: timezone
      description:
        en: "Timezone"
        it: "Fuso orario"
      required: false
      default: Europe/Rome
    - name: PORT
      description:
        en: "Host port for the GoAccess web dashboard"
        it: "Porta dell'host per la dashboard web di GoAccess"
      required: true
      default: "7880"
      type: port
    - name: BASIC_AUTH_USERNAME
      description:
        en: "Username for the web dashboard"
        it: "Nome utente della dashboard web"
      required: true
      default: admin
    - name: BASIC_AUTH_PASSWORD
      generate: password
      description:
        en: "Password for the web dashboard"
        it: "Password della dashboard web"
      required: true
      sensitive: true
    - name: EXCLUDE_IPS
      description:
        en: "Comma-separated IPs to exclude from reports (e.g. your LAN)"
        it: "IP da escludere dai report, separati da virgola (es. la tua LAN)"
      required: false
      default: "127.0.0.1"
      hint:
        en: "Example: 127.0.0.1,192.168.1.1"
        it: "Esempio: 127.0.0.1,192.168.1.1"
    - name: HTML_REFRESH
      description:
        en: "Auto-refresh interval for the HTML report (seconds)"
        it: "Intervallo di aggiornamento del report HTML (secondi)"
      required: false
      default: "5"
      type: number
      min: 1
    - name: KEEP_LAST
      description:
        en: "Number of days to keep in storage"
        it: "Giorni da conservare"
      required: false
      default: "15"
      type: number
      min: 1
    - name: PROCESSING_THREADS
      description:
        en: "Number of log processing threads (set to number of CPU cores)"
        it: "Thread di elaborazione dei log (pari ai core della CPU)"
      required: false
      default: "1"
      type: number
      min: 1
  volumes:
    - container: /opt/log
      description:
        en: "Nginx Proxy Manager logs directory (the 'logs' folder inside your NPM data path)"
        it: "Cartella dei log di Nginx Proxy Manager (la cartella 'logs' nei dati di NPM)"
      required: true
      hint:
        en: "Typically: /your/npm/data/logs"
        it: "Di solito: /percorso/dati/npm/logs"

services:
  goaccess:
    image: xavierh/goaccess-for-nginxproxymanager:latest
    container_name: goaccess
    environment:
      - TZ=${TZ}
      - BASIC_AUTH=True
      - BASIC_AUTH_USERNAME=${BASIC_AUTH_USERNAME}
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD}
      - EXCLUDE_IPS=${EXCLUDE_IPS}
      - LOG_TYPE=NPM
      - ENABLE_BROWSERS_LIST=True
      - HTML_REFRESH=${HTML_REFRESH}
      - KEEP_LAST=${KEEP_LAST}
      - PROCESSING_THREADS=${PROCESSING_THREADS}
      - SKIP_ARCHIVED_LOGS=False
      - DEBUG=False
    ports:
      - "${PORT}:7880"
    volumes:
      - ???:/opt/log
    restart: always
