x-nexos:
  name: Paperless-NGX
  tagline:
    en: Scan, index and archive all your physical documents
    it: Scansiona, indicizza e archivia tutti i tuoi documenti fisici
  description:
    en: |-
      Paperless-NGX is a document management system that transforms your physical
      documents into a searchable online archive. It automatically OCR-processes
      scanned documents, extracts metadata, and lets you tag, search and retrieve
      any document instantly.

      Includes Gotenberg (PDF/HTML conversion) and Apache Tika (document parsing)
      for broad format support. Drop files into the consume folder to have them
      processed automatically.
    it: |-
      Paperless-NGX è un sistema di gestione documentale che trasforma i tuoi
      documenti fisici in un archivio digitale ricercabile. Processa automaticamente
      i documenti con OCR, estrae metadati e permette di taggare, cercare e
      recuperare qualsiasi documento istantaneamente.

      Include Gotenberg (conversione PDF/HTML) e Apache Tika (parsing documenti)
      per supporto ai formati più diffusi. Trascina i file nella cartella consume
      per l'elaborazione automatica.
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/paperless-ngx.svg
  category: Productivity
  tags:
    - documents
    - ocr
    - archive
    - paperless
  developer: paperless-ngx
  version: latest
  license: GPL-3.0
  port: 80
  min_ram: "2GB"
  website: https://docs.paperless-ngx.com
  repo: https://github.com/paperless-ngx/paperless-ngx
  docs: https://docs.paperless-ngx.com
  template_version: 2
  web:
    port: HOST_PORT
    scheme: http
    path: /
  post_install:
    notes:
      en: "Sign in with {PAPERLESS_ADMIN_USER} / {PAPERLESS_ADMIN_PASSWORD}."
      it: "Accedi con {PAPERLESS_ADMIN_USER} / {PAPERLESS_ADMIN_PASSWORD}."
  env:
    - name: HOST_PORT
      description:
        en: "Host port for the Paperless web interface"
        it: "Porta dell'host per l'interfaccia web di Paperless"
      required: true
      default: "80"
      type: port
    - name: TZ
      detect: timezone
      description:
        en: "Timezone"
        it: "Fuso orario"
      required: false
      default: Europe/Rome
    - name: PAPERLESS_SECRET_KEY
      generate: {type: hex, length: 32}
      description:
        en: "Secret key for session encryption (generated automatically)"
        it: "Chiave segreta per la cifratura delle sessioni (generata automaticamente)"
      required: true
      sensitive: true
    - name: PAPERLESS_URL
      description:
        en: "Public URL of your Paperless instance (used for links in emails)"
        it: "URL pubblico di Paperless (usato per i link nelle email)"
      required: false
      type: url
      placeholder: "https://paperless.yourdomain.com"
    - name: PAPERLESS_ADMIN_USER
      description:
        en: "Initial admin username"
        it: "Nome utente dell'amministratore iniziale"
      required: true
      default: admin
    - name: PAPERLESS_ADMIN_PASSWORD
      generate: password
      description:
        en: "Initial admin password"
        it: "Password dell'amministratore iniziale"
      required: true
      sensitive: true
    - name: PAPERLESS_OCR_LANGUAGE
      description:
        en: "Tesseract OCR language(s) — use + to combine multiple"
        it: "Lingue dell'OCR Tesseract: usa + per combinarne più di una"
      required: false
      default: ita+eng
      hint:
        en: "Examples: eng (English), ita (Italian), deu (German), fra (French)\nCombine: ita+eng — full list: https://tesseract-ocr.github.io/tessdoc/Data-Files-in-different-versions.html"
        it: "Esempi: eng (inglese), ita (italiano), deu (tedesco), fra (francese)\nCombinazioni: ita+eng; elenco completo: https://tesseract-ocr.github.io/tessdoc/Data-Files-in-different-versions.html"
    - name: DB_PASSWORD
      generate: password
      description:
        en: "Internal PostgreSQL password (used only between containers)"
        it: "Password interna di PostgreSQL (usata solo tra i container)"
      required: true
      sensitive: true
      default: paperless_db_secret
  volumes:
    - container: /usr/src/paperless/data
      description:
        en: "Paperless application data (index, thumbnails, classifier)"
        it: "Dati dell'applicazione Paperless (indice, anteprime, classificatore)"
      required: true
      default: /var/lib/paperless/data
    - container: /usr/src/paperless/media
      description:
        en: "Archived documents and originals"
        it: "Documenti archiviati e originali"
      required: true
      default: /var/lib/paperless/media
    - container: /usr/src/paperless/consume
      description:
        en: "Inbox folder — drop documents here for automatic processing"
        it: "Cartella di ingresso: i documenti messi qui vengono elaborati automaticamente"
      required: true
      default: /var/lib/paperless/consume
    - container: /usr/src/paperless/export
      description:
        en: "Export destination folder"
        it: "Cartella di destinazione delle esportazioni"
      required: false
      default: /var/lib/paperless/export
    - container: /var/lib/postgresql/data
      description:
        en: "PostgreSQL database"
        it: "Database PostgreSQL"
      required: true
      default: /var/lib/paperless/db

services:
  broker:
    image: docker.io/library/redis:7
    container_name: paperless_broker
    volumes:
      - redisdata:/data
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:17
    container_name: paperless_db
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ???:/var/lib/postgresql/data
    restart: unless-stopped

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    ports:
      - "${HOST_PORT}:8000"
    volumes:
      - ???:/usr/src/paperless/data
      - ???:/usr/src/paperless/media
      - ???:/usr/src/paperless/consume
      - ???:/usr/src/paperless/export
    env_file:
      - .env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPASS: ${DB_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE}
      PAPERLESS_TIME_ZONE: ${TZ}
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.19
    container_name: paperless_gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"

  tika:
    image: docker.io/apache/tika:latest
    container_name: paperless_tika
    restart: unless-stopped

volumes:
  redisdata:
