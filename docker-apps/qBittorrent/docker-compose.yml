x-nexos:
  name: qBittorrent
  tagline:
    en: Feature-rich BitTorrent client with web interface
    it: Client BitTorrent ricco di funzionalità con interfaccia web
  description:
    en: |-
      qBittorrent is a free and open-source BitTorrent client that aims to be a good alternative to µTorrent. It features a polished web interface, built-in torrent search engine, RSS feed support with auto-download rules, sequential downloading, IP filtering and bandwidth scheduling — all without ads or bundled software.

      First login: username "admin", password printed in the container logs on first start. Run: docker logs qbittorrent | grep -i password — then change it in Settings → Web UI.
    it: |-
      qBittorrent è un client BitTorrent gratuito e open-source pensato come alternativa a µTorrent. Offre un'interfaccia web curata, motore di ricerca integrato, supporto RSS con regole di download automatico, download sequenziale, filtro IP e pianificazione della banda — senza pubblicità né software in bundle.

      Primo accesso: username "admin", password stampata nei log del container al primo avvio. Esegui: docker logs qbittorrent | grep -i password — poi cambiala in Impostazioni → Interfaccia web.
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/qbittorrent.svg
  thumbnail: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/qbittorrent.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/qBittorrent/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/qBittorrent/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/qBittorrent/screenshot-3.png
  category: Downloaders
  tags:
    - torrent
    - bittorrent
    - downloader
    - p2p
  developer: linuxserver
  version: latest
  license: GPL-2.0
  port: 8080
  arch:
    - amd64
    - arm64
    - arm/v7
  ports:
    - port: 8080
      description:
        en: "Web interface"
        it: "Interfaccia web"
      protocol: tcp
    - port: 6881
      description:
        en: "BitTorrent peer connections (TCP)"
        it: "Connessioni BitTorrent con i peer (TCP)"
      protocol: tcp
    - port: 6881
      description:
        en: "BitTorrent peer connections (UDP)"
        it: "Connessioni BitTorrent con i peer (UDP)"
      protocol: udp
  website: https://www.qbittorrent.org
  repo: https://github.com/qbittorrent/qBittorrent
  docs: https://github.com/qbittorrent/qBittorrent/wiki
  template_version: 3
  web:
    port: HOST_PORT
    scheme: http
    path: /
  post_install:
    notes:
      en: "The temporary admin password is printed in the container log: change it in Tools → Options → Web UI."
      it: "La password temporanea di admin è nel log del container: cambiala in Strumenti → Opzioni → Interfaccia web."
  env:
    - name: HOST_PORT
      description:
        en: "Host port for the qBittorrent web interface"
        it: "Porta dell'host per l'interfaccia web di qBittorrent"
      required: true
      default: "8080"
      type: port
    - name: PEERPORT
      description:
        en: "BitTorrent peer port for incoming connections (TCP and UDP)"
        it: "Porta BitTorrent per le connessioni in ingresso (TCP e UDP)"
      hint:
        en: "Open this port on your firewall and forward it on your router for the best connectivity.\nThe same value is applied both to the qBittorrent setting and the host port mapping."
        it: "Apri questa porta sul firewall e inoltrala sul router per la migliore connettività.\nLo stesso valore vale per l'impostazione di qBittorrent e per la porta pubblicata sull'host."
      required: true
      default: "6881"
      type: port
    - name: PUID
      gid_var: PGID
      description:
        en: "UID of the user that owns your download files"
        it: "Utente proprietario dei file scaricati"
      required: false
      default: "1000"
      type: user
    - name: PGID
      description:
        en: "GID of the user that owns your download files"
        it: "Gruppo proprietario dei file scaricati"
      required: false
      default: "1000"
      type: group
    - name: TZ
      detect: timezone
      description:
        en: "Timezone"
        it: "Fuso orario"
      required: false
      default: Europe/Rome
      placeholder: "Europe/Rome"
  volumes:
    - container: /config
      description:
        en: "qBittorrent configuration, settings and session files"
        it: "Configurazione, impostazioni e file di sessione di qBittorrent"
      required: true
    - container: /downloads
      description:
        en: "Directory where completed and in-progress downloads are stored"
        it: "Cartella dei download completati e in corso"
      required: true

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=???
      - PGID=???
      - TZ=???
      - WEBUI_PORT=${HOST_PORT}
      - TORRENTING_PORT=${PEERPORT}
    ports:
      - "${HOST_PORT}:${HOST_PORT}"
      - "${PEERPORT}:6881"
      - "${PEERPORT}:6881/udp"
    volumes:
      - ???:/config
      - ???:/downloads
    stop_grace_period: "10s"
    restart: unless-stopped
