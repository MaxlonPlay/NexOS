x-nexos:
  name: Jellyfin
  tagline:
    en: Free media server with optional hardware transcoding
    it: Media server libero con transcodifica hardware opzionale
  description:
    en: Jellyfin is a free and open-source media server for movies, TV shows and music. It supports hardware-accelerated transcoding via Intel/AMD iGPU (VAAPI / Quick Sync) or NVIDIA GPU (NVENC/NVDEC) — enable the matching optional feature during installation. Configure the codec type afterward in Dashboard → Playback → Transcoding.
    it: Jellyfin è un media server libero e open-source per film, serie TV e musica. Supporta la transcodifica hardware via Intel/AMD iGPU (VAAPI / Quick Sync) o GPU NVIDIA (NVENC/NVDEC) — attiva la funzionalità opzionale corrispondente durante l'installazione. Configura il tipo di codec in Dashboard → Riproduzione → Transcodifica.
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/jellyfin.svg
  thumbnail: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Jellyfin/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Jellyfin/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Jellyfin/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Jellyfin/screenshot-3.png
  category: Media
  tags:
    - media
    - streaming
    - movies
    - tv shows
    - music
    - transcoding
    - hardware acceleration
    - dlna
  developer: Jellyfin Team
  version: latest
  license: GPL-2.0
  port: 8096
  arch:
    - amd64
    - arm64
  ports:
    - port: 8096
      description:
        en: "Web interface / API"
        it: "Interfaccia web / API"
      protocol: tcp
    - port: 7359
      description:
        en: "Client auto-discovery"
        it: "Rilevamento automatico dei client"
      protocol: udp
    - port: 1900
      description:
        en: "DLNA server discovery"
        it: "Rilevamento del server DLNA"
      protocol: udp
  website: https://jellyfin.org
  repo: https://github.com/jellyfin/jellyfin
  docs: https://jellyfin.org/docs
  template_version: 3
  web:
    port: HOST_PORT
    scheme: http
    path: /
  env:
    - name: HOST_PORT
      description:
        en: "Host port for the Jellyfin web interface"
        it: "Porta dell'host per l'interfaccia web di Jellyfin"
      required: true
      default: "8096"
      type: port
    - name: PUID
      gid_var: PGID
      description:
        en: "UID of the user that owns your media files"
        it: "Utente proprietario dei file multimediali"
      required: false
      default: "1000"
      type: user
    - name: PGID
      description:
        en: "GID of the user that owns your media files"
        it: "Gruppo proprietario dei file multimediali"
      required: false
      default: "1000"
      type: group
    - name: TZ
      detect: timezone
      description:
        en: "Timezone (e.g. Europe/Rome)"
        it: "Fuso orario (es. Europe/Rome)"
      required: false
      default: Europe/Rome
      placeholder: "Europe/Rome"
    - name: JELLYFIN_PublishedServerUrl
      description:
        en: "Public URL shown to clients — needed only behind a reverse proxy"
        it: "URL pubblico mostrato ai client, necessario solo dietro un reverse proxy"
      type: url
      required: false
      placeholder: "https://jellyfin.yourdomain.com"
  features:
    - id: hw_accel_igpu
      requires_hw: [dri]
      name:
        en: iGPU Acceleration — Intel or AMD
        it: Accelerazione iGPU — Intel o AMD
      description:
        en: Passes /dev/dri to the container for hardware transcoding. Works for both Intel (VAAPI / Quick Sync) and AMD (VAAPI). After install, enable the matching codec in Jellyfin → Dashboard → Playback → Transcoding.
        it: Passa /dev/dri al container per la transcodifica hardware. Funziona con Intel (VAAPI / Quick Sync) e AMD (VAAPI). Dopo l'installazione, abilita il codec corretto in Jellyfin → Dashboard → Riproduzione → Transcodifica.
      default: false
      env:
        - name: GPU_TYPE
          description:
            en: "Your GPU brand — determines which codec to enable in Jellyfin admin"
            it: "Marca della GPU: indica quale codec attivare nell'amministrazione di Jellyfin"
          type: select
          options:
            - Intel — Quick Sync (QSV)
            - Intel — VAAPI
            - AMD — VAAPI
          required: true
          default: Intel — Quick Sync (QSV)
        - name: RENDER_GID
          detect: render_gid
          description:
            en: "GID of the 'render' group on the host"
            it: "GID del gruppo 'render' sull'host"
          required: true
          default: "103"
          type: number
    - id: hw_accel_nvidia
      requires_hw: [nvidia]
      name:
        en: NVIDIA GPU Acceleration
        it: Accelerazione GPU NVIDIA
      description:
        en: Enables NVENC/NVDEC hardware transcoding via nvidia-container-toolkit. Requires NVIDIA drivers and nvidia-container-toolkit installed on the host. After install, enable NVENC in Jellyfin → Dashboard → Playback → Transcoding.
        it: Abilita la transcodifica hardware NVENC/NVDEC tramite nvidia-container-toolkit. Richiede i driver NVIDIA e nvidia-container-toolkit sul host. Dopo l'installazione, abilita NVENC in Jellyfin → Dashboard → Riproduzione → Transcodifica.
      default: false
      env:
        - name: NVIDIA_VISIBLE_DEVICES
          description:
            en: "Which NVIDIA GPUs to expose to the container"
            it: "GPU NVIDIA da rendere disponibili al container"
          required: true
          default: "all"
          hint:
            en: "'all' exposes every GPU. For a specific GPU use its UUID:\n  nvidia-smi -L"
            it: "'all' rende disponibili tutte le GPU. Per una sola, usa il suo UUID:\n  nvidia-smi -L"
        - name: NVIDIA_DRIVER_CAPABILITIES
          description:
            en: "NVIDIA driver capabilities passed to the container"
            it: "Funzioni del driver NVIDIA passate al container"
          required: false
          default: "compute,video,utility"
  volumes:
    - container: /config
      description:
        en: "Jellyfin configuration, metadata and database"
        it: "Configurazione, metadati e database di Jellyfin"
      required: true
    - container: /cache
      description:
        en: "Transcoding and image cache directory"
        it: "Cartella per la cache di transcodifica e immagini"
      required: true
  media_volumes:
    hint:
      en: "Add one path per library. Left = folder on your server, Right = folder inside the container (mounted read-only). You can add a single /multimedia or split into /movies, /tv, /music — your choice."
      it: "Aggiungi un percorso per libreria. A sinistra la cartella sul server, a destra quella nel container (in sola lettura). Puoi aggiungere un'unica /multimedia oppure dividere in /movies, /tv, /music."
    suggestions:
      - container: /movies
        label:
          en: "Movies"
          it: "Film"
      - container: /tv
        label:
          en: "TV Shows"
          it: "Serie TV"
      - container: /music
        label:
          en: "Music"
          it: "Musica"

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=???
      - PGID=???
      - TZ=???
      - JELLYFIN_PublishedServerUrl=
# x-nexos-if: hw_accel_nvidia
      - NVIDIA_VISIBLE_DEVICES=
      - NVIDIA_DRIVER_CAPABILITIES=
# x-nexos-endif
    ports:
      - "${HOST_PORT}:8096"
      - "7359:7359/udp"
      - "1900:1900/udp"
    volumes:
      - ???:/config
      - ???:/cache
      # x-nexos-media-volumes
# x-nexos-if: hw_accel_igpu
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID}"
      - "44"
# x-nexos-endif
# x-nexos-if: hw_accel_nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute, utility]
# x-nexos-endif
    restart: unless-stopped
