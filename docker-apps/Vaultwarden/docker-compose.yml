x-nexos:
  name: Vaultwarden
  tagline:
    en: Lightweight self-hosted password manager compatible with Bitwarden
    it: Password manager self-hosted leggero compatibile con Bitwarden
  description:
    en: Vaultwarden is an unofficial Bitwarden server implementation written in Rust. It is fully compatible with all official Bitwarden clients (mobile, browser extension, desktop) while being much lighter on resources than the official server. Supports organizations, 2FA, attachments and the admin panel.
    it: Vaultwarden è un'implementazione non ufficiale del server Bitwarden scritta in Rust. È completamente compatibile con tutti i client ufficiali Bitwarden (mobile, estensione browser, desktop) ma molto più leggero del server ufficiale. Supporta organizzazioni, 2FA, allegati e pannello admin.
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/vaultwarden.svg
  thumbnail: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/vaultwarden.png
  screenshot_link:
    - https://getumbrel.github.io/umbrel-apps-gallery/vaultwarden/1.jpg
    - https://getumbrel.github.io/umbrel-apps-gallery/vaultwarden/2.jpg
    - https://getumbrel.github.io/umbrel-apps-gallery/vaultwarden/3.jpg
  category: Security
  tags:
    - password manager
    - bitwarden
    - security
    - 2fa
  developer: dani-garcia
  version: latest
  license: AGPL-3.0
  port: 80
  arch:
    - amd64
    - arm64
    - arm/v7
  website: https://github.com/dani-garcia/vaultwarden
  repo: https://github.com/dani-garcia/vaultwarden
  docs: https://github.com/dani-garcia/vaultwarden/wiki
  template_version: 2
  web:
    port: HOST_PORT
    scheme: http
    path: /
  post_install:
    notes:
      en: "Admin panel: /admin — password {ADMIN_PASSWORD}. Keep it: it is not saved in clear text."
      it: "Pannello di amministrazione: /admin — password {ADMIN_PASSWORD}. Conservala: non viene salvata in chiaro."
  env:
    - name: HOST_PORT
      description:
        en: "Host port to expose Vaultwarden on"
        it: "Porta dell'host su cui pubblicare Vaultwarden"
      required: true
      default: "6821"
      type: port
    - name: ADMIN_PASSWORD
      description:
        en: "Password for the /admin panel (only its Argon2 hash is saved)"
        it: "Password del pannello /admin (viene salvato solo il suo hash Argon2)"
      required: false
      sensitive: true
      generate: password
    - name: ADMIN_TOKEN
      generate: {type: argon2, from: ADMIN_PASSWORD}
      description:
        en: "Argon2id hash of ADMIN_PASSWORD, computed automatically"
        it: "Hash Argon2id di ADMIN_PASSWORD, calcolato automaticamente"
      required: true
      sensitive: true
  volumes:
    - container: /data
      description:
        en: "Vaultwarden data directory (vault, attachments, database)"
        it: "Cartella dei dati di Vaultwarden (cassaforte, allegati, database)"
      required: true

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "${HOST_PORT}:80"
    environment:
      - ADMIN_TOKEN=???
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ???:/data
