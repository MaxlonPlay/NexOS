x-nexos:
  name: Nginx Proxy Manager
  tagline:
    en: Reverse proxy with SSL management via a simple web UI
    it: Reverse proxy con gestione SSL tramite una semplice interfaccia web
  description:
    en: |-
      Nginx Proxy Manager lets you forward web services to your servers with free SSL from Let's Encrypt, custom certificates, access lists, and redirects — all from a simple web interface. No Nginx knowledge required.

      Ports 80 and 443 are fixed (they are the actual proxy ports). Only the admin UI port is configurable.

      Default credentials on first login:
        Email:    admin@example.com
        Password: changeme
    it: |-
      Nginx Proxy Manager permette di instradare i servizi web verso i tuoi server con SSL gratuito di Let's Encrypt, certificati personalizzati, liste di accesso e redirect — tutto da un'interfaccia web semplice. Nessuna conoscenza di Nginx richiesta.

      Le porte 80 e 443 sono fisse (sono le porte del proxy vero e proprio). Solo la porta dell'admin UI è configurabile.

      Credenziali predefinite al primo accesso:
        Email:    admin@example.com
        Password: changeme
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/nginx-proxy-manager.svg
  category: Network
  tags:
    - proxy
    - reverse-proxy
    - nginx
    - ssl
    - letsencrypt
    - network
  developer: jc21
  version: latest
  license: MIT
  port: 81
  arch:
    - amd64
    - arm64
  website: https://nginxproxymanager.com
  repo: https://github.com/NginxProxyManager/nginx-proxy-manager
  docs: https://nginxproxymanager.com/guide/
  screenshots:
    - https://nginxproxymanager.com/screenshots/proxy-hosts.png
    - https://nginxproxymanager.com/screenshots/proxy-hosts-add.png
    - https://nginxproxymanager.com/screenshots/redirection-hosts.png
    - https://nginxproxymanager.com/screenshots/certificates.png
  template_version: 2
  web:
    port: ADMIN_PORT
    scheme: http
    path: /
  post_install:
    notes:
      en: "First sign-in: admin@example.com / changeme — you will be asked to change them."
      it: "Primo accesso: admin@example.com / changeme — ti verrà chiesto di cambiarli."
  env:
    - name: ADMIN_PORT
      description:
        en: "Admin web UI port"
        it: "Porta dell'interfaccia web di amministrazione"
      required: true
      default: "81"
      type: port
      hint:
        en: "Ports 80 and 443 are fixed — they handle all proxied traffic."
        it: "Le porte 80 e 443 sono fisse: gestiscono tutto il traffico del proxy."
    - name: TZ
      detect: timezone
      description:
        en: "Timezone"
        it: "Fuso orario"
      required: false
      default: Europe/Rome
  volumes:
    - container: /data
      description:
        en: "NPM database, proxy configs and managed certificates"
        it: "Database, configurazioni dei proxy e certificati di NPM"
      required: true
    - container: /etc/letsencrypt
      description:
        en: "Let's Encrypt certificates (renewed automatically)"
        it: "Certificati Let's Encrypt (rinnovati automaticamente)"
      required: true

services:
  app:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    environment:
      - TZ=${TZ}
    ports:
      - "80:80"
      - "443:443"
      - "${ADMIN_PORT}:81"
    volumes:
      - ???:/data
      - ???:/etc/letsencrypt
    restart: unless-stopped
