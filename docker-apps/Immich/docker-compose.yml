name: immich

x-nexos:
  name: Immich
  tagline: "High-performance self-hosted photo and video management"
  description:
    en: "Immich is a self-hosted backup solution for photos and videos on mobile devices.\nIt supports automatic backup, face recognition, CLIP-based search, shared albums,\nand much more — all running on your own hardware."
    it: "Immich è una soluzione self-hosted per il backup di foto e video dei dispositivi mobili.\nSupporta backup automatico, riconoscimento dei volti, ricerca CLIP, album condivisi\ne molto altro, tutto sul tuo hardware."
  icon: https://raw.githubusercontent.com/immich-app/immich/main/design/immich-logo.svg
  developer: immich-app
  version: release
  category: Media
  website: https://immich.app
  repo: https://github.com/immich-app/immich
  docs: https://immich.app/docs
  port: 80
  min_ram: "4GB"
  template_version: 2
  web:
    port: HOST_PORT
    scheme: http
    path: /
  env:
    - name: HOST_PORT
      description:
        en: "Host port for the Immich web interface"
        it: "Porta dell'host per l'interfaccia web di Immich"
      required: true
      default: "2283"
      type: port
    - name: IMMICH_VERSION
      description:
        en: "Immich version tag (leave 'release' for latest stable)"
        it: "Versione di Immich (lascia 'release' per l'ultima stabile)"
      required: false
      default: release
    - name: DB_PASSWORD
      generate: password
      description:
        en: "PostgreSQL password"
        it: "Password di PostgreSQL"
      sensitive: true
      required: true
      default: immich_password
    - name: DB_USERNAME
      description:
        en: "PostgreSQL username"
        it: "Utente di PostgreSQL"
      required: true
      default: postgres
    - name: DB_DATABASE_NAME
      description:
        en: "PostgreSQL database name"
        it: "Nome del database PostgreSQL"
      required: true
      default: immich
  volumes:
    - container: /data
      description:
        en: "Path on host where photos and videos will be stored"
        it: "Cartella dell'host in cui salvare foto e video"
      required: true
      default: /var/lib/immich/upload
    - container: /var/lib/postgresql/data
      description:
        en: "Path on host for the PostgreSQL database"
        it: "Cartella dell'host per il database PostgreSQL"
      required: true
      default: /var/lib/immich/db
    - container: /cache
      description:
        en: "Path on host for ML model cache (face recognition, CLIP) — only used when ML is enabled"
        it: "Cartella dell'host per la cache dei modelli ML (riconoscimento volti, CLIP), usata solo con il ML attivo"
      required: false
      default: /var/lib/immich/model-cache
  features:
    - id: enable_ml
      name: "Machine Learning"
      description:
        en: "Enable the machine-learning container for face recognition and CLIP-based smart search. Disable to save resources."
        it: "Attiva il container di machine learning per il riconoscimento dei volti e la ricerca intelligente CLIP. Disattivalo per risparmiare risorse."
      default: true
    - id: ml_accel
      requires: enable_ml
      name: "ML Hardware Acceleration"
      description:
        en: "Hardware accelerator for machine learning (face recognition, CLIP search). Choose the option that matches your hardware."
        it: "Acceleratore hardware per il machine learning (riconoscimento volti, ricerca CLIP). Scegli l'opzione adatta al tuo hardware."
      type: select
      default: none
      options:
        - value: none
          label:
            en: "CPU only"
            it: "Solo CPU"
          description:
            en: "No hardware acceleration — compatible with all systems, higher CPU usage."
            it: "Nessuna accelerazione hardware: compatibile con tutti i sistemi, più carico sulla CPU."
        - value: openvino
          requires_hw: [dri]
          label: "Intel OpenVINO"
          description:
            en: "For Intel CPUs, integrated GPUs and NPUs. Passes /dev/dri to the container (VAAPI). Works on most modern Intel systems."
            it: "Per CPU, GPU integrate e NPU Intel. Passa /dev/dri al container (VAAPI). Funziona sulla maggior parte dei sistemi Intel recenti."
          image_tag_suffix: "-openvino"
        - value: cuda
          requires_hw: [nvidia]
          label: "NVIDIA CUDA"
          description:
            en: "For NVIDIA GPUs. Requires nvidia-container-toolkit installed on the host."
            it: "Per GPU NVIDIA. Richiede nvidia-container-toolkit installato sull'host."
          image_tag_suffix: "-cuda"
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              description:
                en: "Which NVIDIA GPUs to expose to the container"
                it: "GPU NVIDIA da rendere disponibili al container"
              required: true
              default: all
              hint:
                en: "'all' exposes every GPU. For a specific GPU use its UUID from: nvidia-smi -L"
                it: "'all' rende disponibili tutte le GPU. Per una sola, usa il suo UUID da: nvidia-smi -L"
            - name: NVIDIA_DRIVER_CAPABILITIES
              description:
                en: "NVIDIA driver capabilities passed to the container"
                it: "Funzioni del driver NVIDIA passate al container"
              required: false
              default: "compute,video,utility"
        - value: rocm
          requires_hw: [kfd, dri]
          label: "AMD ROCm"
          description:
            en: "For AMD GPUs (RX 6000+ series). Passes /dev/dri and /dev/kfd to the container."
            it: "Per GPU AMD (serie RX 6000 e successive). Passa /dev/dri e /dev/kfd al container."
          image_tag_suffix: "-rocm"
        - value: armnn
          label: "ARM NN"
          description:
            en: "For ARM-based devices (Raspberry Pi 5, Orange Pi, etc.)."
            it: "Per dispositivi ARM (Raspberry Pi 5, Orange Pi, ecc.)."
          image_tag_suffix: "-armnn"
        - value: rknn
          label: "Rockchip RKNN"
          description:
            en: "For Rockchip SoCs (RK3588, RK3566, etc.). Passes /dev/dri and USB devices."
            it: "Per SoC Rockchip (RK3588, RK3566, ecc.). Passa /dev/dri e i dispositivi USB."
          image_tag_suffix: "-rknn"
    - id: hw_transcode
      name: "Hardware Video Transcoding"
      description:
        en: "Use GPU hardware for video transcoding in immich-server. Independent from ML acceleration."
        it: "Usa la GPU per la transcodifica video in immich-server. Indipendente dall'accelerazione ML."
      type: select
      default: none
      options:
        - value: none
          label:
            en: "CPU only"
            it: "Solo CPU"
          description:
            en: "Software transcoding — works on all hardware, higher CPU usage."
            it: "Transcodifica software: funziona con qualsiasi hardware, più carico sulla CPU."
        - value: vaapi
          requires_hw: [dri]
          label: "Intel / AMD VAAPI"
          description:
            en: "Hardware transcoding for Intel iGPUs and AMD GPUs. Passes /dev/dri to immich-server."
            it: "Transcodifica hardware per iGPU Intel e GPU AMD. Passa /dev/dri a immich-server."
        - value: nvenc
          requires_hw: [nvidia]
          label: "NVIDIA NVENC"
          description:
            en: "Hardware transcoding for NVIDIA GPUs. Requires nvidia-container-toolkit on the host."
            it: "Transcodifica hardware per GPU NVIDIA. Richiede nvidia-container-toolkit sull'host."
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              description:
                en: "Which NVIDIA GPUs to expose (for transcoding)"
                it: "GPU NVIDIA da rendere disponibili (per la transcodifica)"
              required: true
              default: all
              hint:
                en: "'all' exposes every GPU. For a specific GPU use its UUID from: nvidia-smi -L"
                it: "'all' rende disponibili tutte le GPU. Per una sola, usa il suo UUID da: nvidia-smi -L"
            - name: NVIDIA_DRIVER_CAPABILITIES
              description:
                en: "NVIDIA driver capabilities passed to the container"
                it: "Funzioni del driver NVIDIA passate al container"
              required: false
              default: "compute,video,utility"

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # x-nexos-if: hw_transcode=nvenc
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,video,utility}
    # x-nexos-endif
    # x-nexos-if: hw_transcode=vaapi
    devices:
      - /dev/dri:/dev/dri
    device_cgroup_rules:
      - 'c 226:* rmw'
    # x-nexos-endif
    volumes:
      - ???:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - "${HOST_PORT}:2283"
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

# x-nexos-if: enable_ml
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}  # x-nexos-variant: ml_accel
    # x-nexos-if: ml_accel=cuda
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,video,utility}
    # x-nexos-endif
    # x-nexos-if: ml_accel=openvino
    devices:
      - /dev/dri:/dev/dri
    device_cgroup_rules:
      - 'c 226:* rmw'
    # x-nexos-endif
    # x-nexos-if: ml_accel=rocm
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    device_cgroup_rules:
      - 'c 226:* rmw'
    # x-nexos-endif
    # x-nexos-if: ml_accel=armnn
    devices:
      - /dev/dri:/dev/dri
    device_cgroup_rules:
      - 'c 189:* rmw'
    # x-nexos-endif
    # x-nexos-if: ml_accel=rknn
    devices:
      - /dev/dri:/dev/dri
    device_cgroup_rules:
      - 'c 189:* rmw'
    # x-nexos-endif
    volumes:
      - ???:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false
# x-nexos-endif

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ???:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always

