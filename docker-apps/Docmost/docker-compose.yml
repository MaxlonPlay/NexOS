x-nexos:
  name: Docmost
  tagline:
    en: Collaborative wiki and self-hosted knowledge base
    it: Wiki collaborativa e knowledge base self-hosted
  description:
    en: Docmost is an open-source collaborative wiki and documentation platform — a modern alternative to Notion and Confluence. Features a rich-text editor, workspaces, granular permissions, inline comments, nested pages and real-time collaboration.
    it: Docmost è una piattaforma wiki e documentazione collaborativa open-source — alternativa moderna a Notion e Confluence. Include editor ricco, spazi di lavoro, permessi granulari, commenti inline, pagine annidate e collaborazione in tempo reale.
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/docmost.webp
  category: Productivity
  tags:
    - wiki
    - documentation
    - knowledge base
    - notion alternative
    - collaboration
  developer: Docmost
  version: latest
  license: AGPL-3.0
  port: 3000
  arch:
    - amd64
    - arm64
  website: https://docmost.com
  repo: https://github.com/docmost/docmost
  docs: https://docmost.com/docs
  template_version: 2
  web:
    port: HOST_PORT
    scheme: http
    path: /
  env:
    - name: HOST_PORT
      description:
        en: "Host port to expose Docmost on"
        it: "Porta dell'host su cui pubblicare Docmost"
      required: true
      default: "3000"
      type: port
    - name: APP_URL
      description:
        en: "Full public URL including protocol (e.g. https://wiki.yourdomain.com)"
        it: "URL pubblico completo di protocollo (es. https://wiki.tuodominio.com)"
      type: url
      required: true
      hint:
        en: "Must start with http:// or https:// — the app will not start without a valid URL."
        it: "Deve iniziare con http:// o https://: senza un URL valido l'app non si avvia."
    - name: APP_SECRET
      generate: {type: hex, length: 32}
      description:
        en: "Application secret key (used for sessions and encryption)"
        it: "Chiave segreta dell'applicazione (per sessioni e cifratura)"
      sensitive: true
      required: true
    - name: SMTP_HOST
      description:
        en: "SMTP server hostname for outgoing email (optional)"
        it: "Server SMTP per la posta in uscita (facoltativo)"
      required: false
      group: Email
    - name: SMTP_USERNAME
      description:
        en: "SMTP username or sender email address"
        it: "Utente SMTP o indirizzo email del mittente"
      required: false
      group: Email
    - name: SMTP_PASSWORD
      description:
        en: "SMTP password"
        it: "Password SMTP"
      sensitive: true
      required: false
      group: Email
    - name: MAIL_FROM_ADDRESS
      description:
        en: "From address used in outgoing emails"
        it: "Indirizzo del mittente delle email in uscita"
      type: email
      required: false
      group: Email
    - name: MAIL_FROM_NAME
      description:
        en: "Display name for outgoing emails"
        it: "Nome visualizzato nelle email in uscita"
      required: false
      default: Docmost
      group: Email
  volumes:
    - container: /app/data/storage
      description:
        en: "Docmost uploads and attachments"
        it: "Caricamenti e allegati di Docmost"
      required: true
    - container: /var/lib/postgresql/data
      description:
        en: "PostgreSQL database"
        it: "Database PostgreSQL"
      required: true
    - container: /data
      description:
        en: "Redis cache data"
        it: "Dati della cache Redis"
      required: false

services:
  docmost:
    image: docmost/docmost:latest
    depends_on:
      - db
      - redis
    environment:
      - APP_URL=
      - APP_SECRET=???
      - DATABASE_URL=postgresql://docmost:nexos_db_secret@db:5432/docmost?schema=public
      - REDIS_URL=redis://redis:6379
      - MAIL_DRIVER=smtp
      - SMTP_HOST=
      - SMTP_PORT=587
      - SMTP_USERNAME=
      - SMTP_PASSWORD=
      - MAIL_FROM_ADDRESS=
      - MAIL_FROM_NAME=Docmost
      - DISABLE_TELEMETRY=true
    ports:
      - "${HOST_PORT}:3000"
    restart: unless-stopped
    volumes:
      - ???:/app/data/storage

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=docmost
      - POSTGRES_USER=docmost
      - POSTGRES_PASSWORD=nexos_db_secret
    restart: unless-stopped
    volumes:
      - ???:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - ???:/data
